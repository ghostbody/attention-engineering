<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="bannerTitle bannerDescription" font-family="Inter, Helvetica, Arial, sans-serif">
  <title id="bannerTitle">Attention Engineering</title>
  <desc id="bannerDescription">In the AI era, save your scarcest resource. 在 AI 时代，节省你最珍贵的资源</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="0.55" stop-color="#0D1524"/>
      <stop offset="1" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="funnelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="accentRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#background)"/>
  <circle cx="1080" cy="170" r="180" fill="url(#glow)"/>

  <text x="64" y="82" fill="#38BDF8" font-size="13" font-weight="600" letter-spacing="4">A CURATED LIST</text>

  <text x="64" y="148" fill="#F1F5F9" font-size="58" font-weight="700" letter-spacing="2">ATTENTION</text>
  <text x="64" y="210" fill="#F1F5F9" font-size="58" font-weight="700" letter-spacing="2">ENGINEERING</text>

  <rect x="64" y="232" width="120" height="2" fill="url(#accentRule)"/>

  <text x="64" y="266" fill="#CBD5E1" font-size="18" font-weight="400">In the AI era, save your scarcest resource.</text>
  <text x="64" y="294" fill="#94A3B8" font-size="16" font-weight="400" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', Inter, Helvetica, Arial, sans-serif">在 AI 时代，节省你最珍贵的资源</text>

  <g fill="#7DD3FC">
    <circle cx="948" cy="76" r="4" opacity="0.45"/>
    <circle cx="1014" cy="76" r="4" opacity="0.55"/>
    <circle cx="1080" cy="76" r="4" opacity="0.5"/>
    <circle cx="1146" cy="76" r="4" opacity="0.55"/>
    <circle cx="1212" cy="76" r="4" opacity="0.45"/>
    <circle cx="981" cy="100" r="3" opacity="0.35"/>
    <circle cx="1047" cy="100" r="3" opacity="0.4"/>
    <circle cx="1113" cy="100" r="3" opacity="0.4"/>
    <circle cx="1179" cy="100" r="3" opacity="0.35"/>
  </g>

  <g stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.45" fill="url(#funnelFill)">
    <polygon points="948,120 1212,120 1150,184 1010,184"/>
    <polygon points="1018,192 1142,192 1110,240 1050,240"/>
  </g>

  <rect x="1072" y="248" width="16" height="32" rx="8" fill="#22D3EE" fill-opacity="0.55"/>

  <circle cx="1080" cy="300" r="5" fill="#67E8F9"/>
  <circle cx="1080" cy="300" r="11" fill="none" stroke="#67E8F9" stroke-opacity="0.35"/>
</svg>
