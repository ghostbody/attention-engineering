name: Add a resource
description: Suggest a resource that saves human attention.
title: "[Resource] "
labels: [resource]

body:
  - type: markdown
    attributes:
      value: |
        Read CONTRIBUTING.md first. A resource must make people read less, watch less, click less, or wait less. If its main effect is "do more, faster", it will be declined.

  - type: input
    id: resource-name
    attributes:
      label: Resource name
      description: The name exactly as it appears on the site or repository.
      placeholder: Example Reader
    validations:
      required: true

  - type: input
    id: resource-url
    attributes:
      label: URL
      description: Direct link. No tracking parameters, no trailing slash.
      placeholder: https://example.com
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick the single best fit.
      options:
        - Foundations & Reading
        - Awesome Lists & Meta
        - "Distill: Docs to Answers"
        - "Triage: Rank, Dedupe, Batch"
        - Maps & Progressive Disclosure
        - Calm & Focus
        - Attention-Saving Dev Workflow
        - Anti-Patterns & Research
        - Organization & Life
    validations:
      required: true

  - type: dropdown
    id: attention-saved
    attributes:
      label: Which attention does it save?
      description: Choose the dominant effect, not every possible one.
      options:
        - Reading volume
        - Review volume
        - Click count
        - Waiting time
        - Number of interruptions
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: One-sentence reason
      description: Name what it replaces or removes. Example "Turns a 30-minute doc read into a ranked five-item brief."
      render: text
    validations:
      required: true

  - type: checkboxes
    id: used-it
    attributes:
      label: Have you used it yourself?
      options:
        - label: Yes, I have used this resource myself.
          required: true
